name: Build and upload APK to BrowserStack

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: shifts_app
        run: flutter pub get

      - name: Build release APK
        working-directory: shifts_app
        run: flutter build apk --release

      - name: Upload APK to BrowserStack
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(
            curl --fail --silent --show-error \
              --user "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
              --form "file=@shifts_app/build/app/outputs/flutter-apk/app-release.apk" \
              --form "custom_id=shift-reminders-${GITHUB_SHA}" \
              https://api-cloud.browserstack.com/app-automate/upload
          )"
          echo "$response"
