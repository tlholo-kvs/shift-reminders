name: shifts_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^18.0.0
  android_intent_plus: ^5.0.0
  file_picker: ^8.0.0
  csv: ^6.0.0
  shared_preferences: ^2.3.0
  permission_handler: ^11.3.0
  intl: ^0.19.0
  go_router: ^14.0.0
  timezone: ^0.9.0
  http: ^1.6.0
  excel_community: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - lib\assets\images\

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/images/RemindMe app logo (1).png"